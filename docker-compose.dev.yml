services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blockmesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blockmesh}
      POSTGRES_DB: ${POSTGRES_DB:-blockmesh}
    volumes:
      - type: volume
        source: pgdata
        target: /var/lib/postgresql/data
      - type: bind
        source: ./backend/database/migrations
        target: /docker-entrypoint-initdb.d
        read_only: true
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - blockmesh

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - type: volume
        source: redisdata
        target: /data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - blockmesh

  gateway:
    build:
      context: .
      dockerfile: .docker/dev/dev-gateway.Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - type: bind
        source: ./backend
        target: /app
        consistency: cached
    working_dir: /app/gateway
    command: ["air", "-c", ".air.toml"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-blockmesh}:${POSTGRES_PASSWORD:-blockmesh}@postgres:5432/${POSTGRES_DB:-blockmesh}
      REDIS_ADDR: redis:6379
      RPC_ENDPOINT_1: ${RPC_ENDPOINT_1:-https://ethereum-sepolia-rpc.publicnode.com}
      RPC_ENDPOINT_2: ${RPC_ENDPOINT_2:-https://rpc.sepolia.org}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - blockmesh

  admin:
    build:
      context: .
      dockerfile: .docker/dev/dev-admin.Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - type: bind
        source: ./backend
        target: /app
        consistency: cached
    working_dir: /app/admin
    command: ["air", "-c", ".air.toml"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-blockmesh}:${POSTGRES_PASSWORD:-blockmesh}@postgres:5432/${POSTGRES_DB:-blockmesh}
      ADMIN_SECRET: ${ADMIN_SECRET:-devsecret}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - blockmesh

  ingestor:
    build:
      context: .
      dockerfile: .docker/dev/dev-ingestor.Dockerfile
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./backend
        target: /app
        consistency: cached
    working_dir: /app/ingestor
    command: ["air", "-c", ".air.toml"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-blockmesh}:${POSTGRES_PASSWORD:-blockmesh}@postgres:5432/${POSTGRES_DB:-blockmesh}
      RPC_ENDPOINT_1: ${RPC_ENDPOINT_1:-https://ethereum-sepolia-rpc.publicnode.com}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - blockmesh

  web:
    build:
      context: .
      dockerfile: .docker/dev/dev-web.Dockerfile
    restart: unless-stopped
    ports:
      - "3000:5173"
    volumes:
      - type: bind
        source: ./web
        target: /app
        consistency: cached
      - type: volume
        target: /app/node_modules
    working_dir: /app
    command: ["npm", "run", "dev", "--", "--host"]
    environment:
      - NODE_ENV=development
    depends_on:
      - admin
      - gateway
    networks:
      - blockmesh

volumes:
  pgdata:
  redisdata:

networks:
  blockmesh:
    driver: bridge