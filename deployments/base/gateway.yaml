apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: blockmesh
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: blockmesh-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: blockmesh-secrets
                  key: database-url
            - name: REDIS_ADDR
              value: "redis:6379"
            - name: RPC_ENDPOINT_1
              valueFrom:
                configMapKeyRef:
                  name: blockmesh-config
                  key: rpc-endpoint-1
            - name: RPC_ENDPOINT_2
              valueFrom:
                configMapKeyRef:
                  name: blockmesh-config
                  key: rpc-endpoint-2
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: blockmesh
spec:
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 8080
