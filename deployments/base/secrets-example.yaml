# Copy to secrets.yaml and fill in values, then apply with kubectl
# NEVER commit secrets.yaml to git
apiVersion: v1
kind: Secret
metadata:
  name: blockmesh-secrets
  namespace: blockmesh
type: Opaque
stringData:
  postgres-user: "blockmesh"
  postgres-password: "change-me"
  database-url: "postgres://blockmesh:change-me@postgres:5432/blockmesh"
  admin-secret: ""
