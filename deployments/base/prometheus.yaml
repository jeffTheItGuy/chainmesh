apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: blockmesh
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'gateway'
        static_configs:
          - targets: ['gateway:8080']
      - job_name: 'admin'
        static_configs:
          - targets: ['admin:8081']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: blockmesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: blockmesh
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
