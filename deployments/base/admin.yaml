apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: blockmesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      containers:
        - name: admin
          image: blockmesh-admin:latest
          ports:
            - containerPort: 8081
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: blockmesh-secrets
                  key: database-url
            - name: ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: blockmesh-secrets
                  key: admin-secret
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: blockmesh
spec:
  selector:
    app: admin
  ports:
    - port: 80
      targetPort: 8081
