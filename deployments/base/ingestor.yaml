apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestor
  namespace: blockmesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestor
  template:
    metadata:
      labels:
        app: ingestor
    spec:
      containers:
        - name: ingestor
          image: blockmesh-ingestor:latest
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: blockmesh-secrets
                  key: database-url
            - name: RPC_ENDPOINT_1
              valueFrom:
                configMapKeyRef:
                  name: blockmesh-config
                  key: rpc-endpoint-1
