services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blockmesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blockmesh}
      POSTGRES_DB: ${POSTGRES_DB:-blockmesh}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - blockmesh

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - blockmesh

  gateway:
    build:
      context: .
      dockerfile: .docker/prod/prod-gateway.Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-blockmesh}:${POSTGRES_PASSWORD:-blockmesh}@postgres:5432/${POSTGRES_DB:-blockmesh}
      REDIS_ADDR: redis:6379
      RPC_ENDPOINT_1: ${RPC_ENDPOINT_1:-https://ethereum-sepolia-rpc.publicnode.com}
      RPC_ENDPOINT_2: ${RPC_ENDPOINT_2:-https://rpc.sepolia.org}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - blockmesh

  admin:
    build:
      context: .
      dockerfile: .docker/prod/prod-admin.Dockerfile
    restart: unless-stopped
    expose:
      - "8081"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-blockmesh}:${POSTGRES_PASSWORD:-blockmesh}@postgres:5432/${POSTGRES_DB:-blockmesh}
      ADMIN_SECRET: ${ADMIN_SECRET:?ADMIN_SECRET must be set}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - blockmesh

  ingestor:
    build:
      context: .
      dockerfile: .docker/prod/prod-ingestor.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-blockmesh}:${POSTGRES_PASSWORD:-blockmesh}@postgres:5432/${POSTGRES_DB:-blockmesh}
      RPC_ENDPOINT_1: ${RPC_ENDPOINT_1:-https://ethereum-sepolia-rpc.publicnode.com}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - blockmesh

  web:
    build:
      context: .
      dockerfile: .docker/prod/prod-web.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - admin
      - gateway
    networks:
      - blockmesh

volumes:
  pgdata:
  redisdata:

networks:
  blockmesh:
    driver: bridge
