name: PostgreSQL Helm Only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgresql-helm-only
  cancel-in-progress: false

env:
  NAMESPACE: chainmesh
  RELEASE_NAME: postgresql-release
  DEPLOYMENT_NAME: chainmesh-postgresql
  RESTART_REASON: helm-only

jobs:
  helm-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          REMOTE_SSH: ${{ secrets.REMOTE_SSH }}
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
        run: |
          set -euo pipefail
          if [ -z "${REMOTE_SSH:-}" ]; then
            echo "REMOTE_SSH secret is missing." >&2
            exit 1
          fi
          if [ -z "${REMOTE_SERVER:-}" ]; then
            echo "REMOTE_SERVER secret is missing." >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$REMOTE_SSH" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$REMOTE_SERVER" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

      - name: Copy Helm Chart to Remote
        env:
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_DEPLOY_DIR: ${{ secrets.REMOTE_DEPLOY_DIR }}
          REMOTE_WORKSPACE: ${{ secrets.REMOTE_DEPLOY_DIR }}/postgresql-helm-${{ github.run_id }}
        run: |
          set -euo pipefail
          : "${REMOTE_SERVER:?REMOTE_SERVER secret is missing}"
          : "${REMOTE_USER:?REMOTE_USER secret is missing}"
          : "${REMOTE_DEPLOY_DIR:?REMOTE_DEPLOY_DIR secret is missing}"

          if [ ! -d .helm/postgresql ]; then
            echo "Missing .helm/postgresql" >&2
            exit 1
          fi

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$REMOTE_USER@$REMOTE_SERVER" \
            "rm -rf '$REMOTE_WORKSPACE' && mkdir -p '$REMOTE_WORKSPACE/.helm'"

          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -r .helm/postgresql \
            "$REMOTE_USER@$REMOTE_SERVER:$REMOTE_WORKSPACE/.helm/"

      - name: Helm Upgrade Only
        env:
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_DEPLOY_DIR: ${{ secrets.REMOTE_DEPLOY_DIR }}
          REMOTE_WORKSPACE: ${{ secrets.REMOTE_DEPLOY_DIR }}/postgresql-helm-${{ github.run_id }}
        run: |
          set -euo pipefail
          : "${REMOTE_SERVER:?REMOTE_SERVER secret is missing}"
          : "${REMOTE_USER:?REMOTE_USER secret is missing}"
          : "${REMOTE_DEPLOY_DIR:?REMOTE_DEPLOY_DIR secret is missing}"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$REMOTE_USER@$REMOTE_SERVER" \
            REMOTE_WORKSPACE="$REMOTE_WORKSPACE" \
            NAMESPACE="$NAMESPACE" \
            RELEASE_NAME="$RELEASE_NAME" \
            DEPLOYMENT_NAME="$DEPLOYMENT_NAME" \
            RESTART_REASON="$RESTART_REASON" \
            bash << 'ENDSSH'
          set -euo pipefail
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          cd "$REMOTE_WORKSPACE"

          TIMESTAMP=$(date +%s)

          echo "Helm-only deploy: $RELEASE_NAME"

          helm upgrade --install "$RELEASE_NAME" .helm/postgresql \
            --namespace "$NAMESPACE" \
            --set namespace="$NAMESPACE" \
            --set restartTimestamp="$TIMESTAMP" \
            --set restartReason="$RESTART_REASON" \
            --timeout=600s

          kubectl wait --for=condition=available --timeout=300s "deployment/$DEPLOYMENT_NAME" -n "$NAMESPACE" || (
            kubectl logs -n "$NAMESPACE" -l "app=$DEPLOYMENT_NAME" --tail=50 || true
            exit 1
          )
          ENDSSH

      - name: Cleanup Remote Workspace
        if: always()
        env:
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_DEPLOY_DIR: ${{ secrets.REMOTE_DEPLOY_DIR }}
          REMOTE_WORKSPACE: ${{ secrets.REMOTE_DEPLOY_DIR }}/postgresql-helm-${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${REMOTE_SERVER:-}" ] || [ -z "${REMOTE_USER:-}" ] || [ -z "${REMOTE_DEPLOY_DIR:-}" ] || [ -z "${REMOTE_WORKSPACE:-}" ] || [ ! -f "$HOME/.ssh/id_rsa" ]; then
            echo "Skipping cleanup because SSH is not fully configured." >&2
            exit 0
          fi

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$REMOTE_USER@$REMOTE_SERVER" \
            "rm -rf '$REMOTE_WORKSPACE'"