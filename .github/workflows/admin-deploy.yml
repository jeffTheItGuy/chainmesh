name: Admin Deploy
on:
  workflow_dispatch:
env:
  NAMESPACE: chainmesh
  DOMAIN: admin.chainmesh.nimbusurf.com
  RELEASE_NAME: admin-release
  DEPLOYMENT_NAME: chainmesh-admin
  SERVICE_PORT: 8081
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH
        env:
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$REMOTE_SERVER" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Copy Files to Remote
        env:
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_WORKSPACE: ${{ secrets.REMOTE_DEPLOY_DIR }}/admin-${{ github.run_id }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$REMOTE_USER@$REMOTE_SERVER" "rm -rf $REMOTE_WORKSPACE && mkdir -p $REMOTE_WORKSPACE/.helm && mkdir -p $REMOTE_WORKSPACE/backend && mkdir -p $REMOTE_WORKSPACE/.docker/prod"
          scp -o StrictHostKeyChecking=yes -r .helm/admin "$REMOTE_USER@$REMOTE_SERVER:$REMOTE_WORKSPACE/.helm/"
          scp -o StrictHostKeyChecking=yes -r backend/* "$REMOTE_USER@$REMOTE_SERVER:$REMOTE_WORKSPACE/backend/"
          scp -o StrictHostKeyChecking=yes .docker/prod/prod-admin.Dockerfile "$REMOTE_USER@$REMOTE_SERVER:$REMOTE_WORKSPACE/.docker/prod/"
      - name: Build and Deploy on Remote Server
        env:
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_WORKSPACE: ${{ secrets.REMOTE_DEPLOY_DIR }}/admin-${{ github.run_id }}
          BUILD_ID: ${{ github.run_id }}-${{ github.run_number }}
          RESTART_REASON: "github-actions-deploy"
        run: |
          ssh -o StrictHostKeyChecking=yes "$REMOTE_USER@$REMOTE_SERVER" \
            RESTART_REASON="$RESTART_REASON" \
            BUILD_ID="$BUILD_ID" \
            REMOTE_WORKSPACE="$REMOTE_WORKSPACE" \
            NAMESPACE="${{ env.NAMESPACE }}" \
            DOMAIN="${{ env.DOMAIN }}" \
            DEPLOYMENT_NAME="${{ env.DEPLOYMENT_NAME }}" \
            RELEASE_NAME="${{ env.RELEASE_NAME }}" \
            SERVICE_PORT="${{ env.SERVICE_PORT }}" \
            bash << 'ENDSSH'
          set -e
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          cd "$REMOTE_WORKSPACE"
          docker system prune -f
          docker builder prune -f
          docker build --no-cache -f .docker/prod/prod-admin.Dockerfile -t chainmesh-admin:$BUILD_ID .
          docker save chainmesh-admin:$BUILD_ID | k3s ctr images import -
          TIMESTAMP=$(date +%s)
          helm upgrade --install $RELEASE_NAME .helm/admin \
            --namespace "$NAMESPACE" \
            --set namespace="$NAMESPACE" \
            --set ingress.host="${DOMAIN}" \
            --set restartTimestamp="$TIMESTAMP" \
            --set restartReason="$RESTART_REASON" \
            --set image.repository="chainmesh-admin" \
            --set image.tag="$BUILD_ID" \
            --set image.pullPolicy="Never" \
            --timeout=600s
          kubectl wait --for=condition=available --timeout=300s deployment/$DEPLOYMENT_NAME -n $NAMESPACE || (kubectl logs -n $NAMESPACE -l app=$DEPLOYMENT_NAME --tail=50 && helm rollback $RELEASE_NAME -n $NAMESPACE && exit 1)
          ENDSSH
      - name: Cleanup Remote Workspace
        if: always()
        run: |
          ssh -o StrictHostKeyChecking=yes "${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_SERVER }}" "rm -rf ${{ secrets.REMOTE_DEPLOY_DIR }}/admin-${{ github.run_id }}"