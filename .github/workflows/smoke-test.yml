name: Smoke Test (in-cluster)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NAMESPACE: chainmesh

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          REMOTE_SSH: ${{ secrets.REMOTE_SSH }}
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
        run: |
          set -euo pipefail

          if [ -z "${REMOTE_SSH:-}" ]; then
            echo "REMOTE_SSH secret is missing." >&2
            exit 1
          fi

          if [ -z "${REMOTE_SERVER:-}" ]; then
            echo "REMOTE_SERVER secret is missing." >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$REMOTE_SSH" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H "$REMOTE_SERVER" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

      - name: Copy smoke script to k3s node
        env:
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
        run: |
          set -euo pipefail

          : "${REMOTE_SERVER:?REMOTE_SERVER secret is missing}"
          : "${REMOTE_USER:?REMOTE_USER secret is missing}"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$REMOTE_USER@$REMOTE_SERVER" \
            "mkdir -p /tmp/chainmesh-smoke"

          scp -o BatchMode=yes -o StrictHostKeyChecking=yes tests/smoke/smoke-k3s.sh \
            "$REMOTE_USER@$REMOTE_SERVER:/tmp/chainmesh-smoke/smoke-k3s.sh"

      - name: Run smoke tests inside k3s
        id: smoke
        continue-on-error: true
        env:
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TEST_API_KEY: ${{ secrets.PROD_TEST_API_KEY }}
        run: |
          set -euo pipefail

          : "${REMOTE_SERVER:?REMOTE_SERVER secret is missing}"
          : "${REMOTE_USER:?REMOTE_USER secret is missing}"
          : "${TEST_API_KEY:?PROD_TEST_API_KEY secret is missing}"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$REMOTE_USER@$REMOTE_SERVER" \
            NAMESPACE="$NAMESPACE" \
            TEST_API_KEY="$TEST_API_KEY" \
            RESULTS_FILE="/tmp/chainmesh-smoke/results.md" \
            bash /tmp/chainmesh-smoke/smoke-k3s.sh

      - name: Fetch results from k3s node
        if: always()
        env:
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
        run: |
          set -euo pipefail

          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$REMOTE_USER@$REMOTE_SERVER:/tmp/chainmesh-smoke/results.md" ./smoke-results.md \
            || echo "::warning::Could not fetch results file"

      - name: Publish results to job summary
        if: always()
        run: |
          if [ -f smoke-results.md ]; then
            cat smoke-results.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No results file was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail job if smoke tests failed
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "::error::Smoke tests failed — see the job summary above."
          exit 1