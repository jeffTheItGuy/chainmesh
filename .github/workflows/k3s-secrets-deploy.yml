name: K3s Secrets Deploy

on:
  workflow_dispatch:

permissions: {}

env:
  NAMESPACE: chainmesh

jobs:
  deploy-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Deployment Configuration
        run: |
          echo "========================================="
          echo "     K3s SECRETS DEPLOYMENT"
          echo "========================================="
          echo "Namespace: $NAMESPACE"
          echo "Secrets: chainmesh-secrets"
          echo "========================================="

      - name: Setup SSH
        env:
          REMOTE_SSH: ${{ secrets.REMOTE_SSH }}
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
        run: |
          set -euo pipefail

          if [ -z "${REMOTE_SSH:-}" ]; then
            echo "REMOTE_SSH secret is missing." >&2
            exit 1
          fi

          if [ -z "${REMOTE_SERVER:-}" ]; then
            echo "REMOTE_SERVER secret is missing." >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$REMOTE_SSH" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H "$REMOTE_SERVER" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy Secrets to Remote K3s Cluster
        env:
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          DB_USER: ${{ secrets.DATABASE_USER }}
          DB_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          set -euo pipefail

          : "${REMOTE_SERVER:?REMOTE_SERVER secret is missing}"
          : "${REMOTE_USER:?REMOTE_USER secret is missing}"
          : "${DB_USER:?DATABASE_USER secret is missing}"
          : "${DB_PASSWORD:?DATABASE_PASSWORD secret is missing}"
          : "${REDIS_PASSWORD:?REDIS_PASSWORD secret is missing}"
          : "${ADMIN_SECRET:?ADMIN_SECRET secret is missing}"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$REMOTE_USER@$REMOTE_SERVER" \
            NAMESPACE="$NAMESPACE" \
            DB_USER="$DB_USER" \
            DB_PASSWORD="$DB_PASSWORD" \
            REDIS_PASSWORD="$REDIS_PASSWORD" \
            ADMIN_SECRET="$ADMIN_SECRET" \
            bash << 'ENDSSH'
          set -euo pipefail

          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

          if ! kubectl get namespace "$NAMESPACE" >/dev/null 2>&1; then
            kubectl create namespace "$NAMESPACE"
          fi

          kubectl create secret generic chainmesh-secrets \
            --namespace "$NAMESPACE" \
            --from-literal=DATABASE_USER="$DB_USER" \
            --from-literal=DATABASE_PASSWORD="$DB_PASSWORD" \
            --from-literal=POSTGRES_DB="chainmesh" \
            --from-literal=REDIS_PASSWORD="$REDIS_PASSWORD" \
            --from-literal=ADMIN_SECRET="$ADMIN_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "✓ All secrets deployed successfully"
          ENDSSH