name: PostgreSQL Cleanup

on:
  workflow_dispatch:

permissions: {}

env:
  NAMESPACE: chainmesh
  RELEASE_NAME: postgresql-release
  DEPLOYMENT_NAME: chainmesh-postgresql

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        env:
          REMOTE_SSH: ${{ secrets.REMOTE_SSH }}
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
        run: |
          set -euo pipefail

          if [ -z "${REMOTE_SSH:-}" ]; then
            echo "REMOTE_SSH secret is missing." >&2
            exit 1
          fi

          if [ -z "${REMOTE_SERVER:-}" ]; then
            echo "REMOTE_SERVER secret is missing." >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$REMOTE_SSH" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan -H "$REMOTE_SERVER" >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

      - name: Cleanup Helm Release and Resources
        env:
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
        run: |
          set -euo pipefail

          : "${REMOTE_SERVER:?REMOTE_SERVER secret is missing}"
          : "${REMOTE_USER:?REMOTE_USER secret is missing}"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$REMOTE_USER@$REMOTE_SERVER" \
            NAMESPACE="$NAMESPACE" \
            RELEASE_NAME="$RELEASE_NAME" \
            DEPLOYMENT_NAME="$DEPLOYMENT_NAME" \
            bash << 'ENDSSH'
          set -euo pipefail

          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

          helm uninstall "$RELEASE_NAME" -n "$NAMESPACE" 2>/dev/null || echo "⚠️ Release not found"

          echo "⚠️ NOTE: PVC chainmesh-postgresql-pvc was NOT deleted to preserve data"
          ENDSSH