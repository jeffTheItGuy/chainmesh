name: Load Test (in-cluster)

on:
  workflow_dispatch:   # manual only — no schedule

env:
  NAMESPACE: chainmesh

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        env:
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$REMOTE_SERVER" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy k6 script to k3s node
        env:
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$REMOTE_USER@$REMOTE_SERVER" "mkdir -p /tmp/chainmesh-load"
          scp -o StrictHostKeyChecking=yes tests/load/gateway_load.js \
            "$REMOTE_USER@$REMOTE_SERVER:/tmp/chainmesh-load/gateway_load.js"

      - name: Install k6 and run load test inside k3s
        id: load
        continue-on-error: true
        env:
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$REMOTE_USER@$REMOTE_SERVER" \
            NAMESPACE="${{ env.NAMESPACE }}" \
            TEST_API_KEY="${{ secrets.PROD_TEST_API_KEY }}" \
            bash << 'ENDSSH'
          set -e
          set -o pipefail
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

          # Install k6 to /tmp (no root needed, distro-agnostic)
          if [ ! -x /tmp/k6 ]; then
            curl -fsSL https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz -o /tmp/k6.tgz
            tar -xzf /tmp/k6.tgz -C /tmp
            mv /tmp/k6-v0.54.0-linux-amd64/k6 /tmp/k6
            chmod +x /tmp/k6
          fi

          # Resolve gateway ClusterIP (no DNS / Cloudflare)
          GW_SVC=$(kubectl get svc -n "$NAMESPACE" -o name | grep -i gateway | head -1 | sed 's|service/||')
          GW_IP=$(kubectl get svc "$GW_SVC" -n "$NAMESPACE" -o jsonpath='{.spec.clusterIP}')
          GW_PORT=$(kubectl get svc "$GW_SVC" -n "$NAMESPACE" -o jsonpath='{.spec.ports[0].port}')
          GATEWAY_URL="http://${GW_IP}:${GW_PORT}/v1/"
          echo "Load-testing: $GATEWAY_URL"

          /tmp/k6 run \
            --env GATEWAY_URL="$GATEWAY_URL" \
            --env TEST_API_KEY="$TEST_API_KEY" \
            /tmp/chainmesh-load/gateway_load.js 2>&1 | tee /tmp/chainmesh-load/results.txt
          ENDSSH

      - name: Fetch results from k3s node
        if: always()
        env:
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
        run: |
          scp -o StrictHostKeyChecking=yes \
            "$REMOTE_USER@$REMOTE_SERVER:/tmp/chainmesh-load/results.txt" ./load-results.txt \
            || echo "::warning::Could not fetch load results"

      - name: Publish results to job summary
        if: always()
        run: |
          if [ -f load-results.txt ]; then
            {
              echo "## 📊 ChainMesh Load Test Results"
              echo ""
              echo '```'
              cat load-results.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No load results were produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-results-${{ github.run_number }}
          path: load-results.txt
          if-no-files-found: ignore

      - name: Fail job if thresholds exceeded
        if: steps.load.outcome == 'failure'
        run: |
          echo "::error::Load test failed thresholds — see the job summary above."
          exit 1