namespace: chainmesh
replicaCount: 1

image:
  repository: chainmesh-admin
  tag: ""
  pullPolicy: Never

service:
  port: 8081
  type: ClusterIP

# [INGRESS BLOCK REMOVED]

envFrom:
  - secretRef:
      name: chainmesh-secrets

env:
  PORT: "8081"
  POSTGRES_DB: "chainmesh"

resources:
  limits:
    cpu: "300m"
    memory: "384Mi"
  requests:
    cpu: "50m"
    memory: "128Mi"

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

networkPolicy:
  allowedFrom:
    - app: chainmesh-web
  allowedTo:
    - app: chainmesh-postgresql
      port: 5432