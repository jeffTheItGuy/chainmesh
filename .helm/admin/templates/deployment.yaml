apiVersion: apps/v1
kind: Deployment
metadata:
  name: chainmesh-admin
  namespace: {{ .Values.namespace }}
  labels:
    app: chainmesh-admin
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: chainmesh-admin
  template:
    metadata:
      labels:
        app: chainmesh-admin
      annotations:
        rollme: {{ randAlphaNum 5 | quote }}
    spec:
      securityContext: {{ toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: admin
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          envFrom: {{ toYaml .Values.envFrom | nindent 12 }}
          env:
          env:
            - name: DATABASE_URL
              value: "host=chainmesh-postgresql-svc port=5432 user=$(DATABASE_USER) password=$(DATABASE_PASSWORD) dbname=$(POSTGRES_DB) sslmode=disable"
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources: {{ toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}