apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chainmesh-gateway-policy
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: chainmesh-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "kube-system"
      ports:
        - protocol: TCP
          port: {{ $.Values.service.port }}
  {{- range .Values.networkPolicy.allowedFrom }}
    - from:
        - podSelector:
            matchLabels:
              app: {{ .app }}
      ports:
        - protocol: TCP
          port: {{ $.Values.service.port }}
  {{- end }}
  egress:
  {{- range .Values.networkPolicy.allowedTo }}
    - to:
        - podSelector:
            matchLabels:
              app: {{ .app }}
      ports:
        - protocol: TCP
          port: {{ .port }}
  {{- end }}
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
    # ▼▼▼ ADD THIS BLOCK ▼▼▼
    # Allow outbound HTTP/HTTPS to the public internet (for RPC endpoints)
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443