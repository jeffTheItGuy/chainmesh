apiVersion: v1
kind: Service
metadata:
  name: chainmesh-gateway-svc
  namespace: {{ .Values.namespace }}
  labels:
    app: chainmesh-gateway
spec:
  type: {{ .Values.service.type }}
  selector:
    app: chainmesh-gateway
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      name: http
