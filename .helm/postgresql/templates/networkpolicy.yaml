{{- if .Values.networkPolicy }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chainmesh-postgresql-policy
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: chainmesh-postgresql
  policyTypes:
    - Ingress
  ingress:
    {{- range .Values.networkPolicy.allowedFrom }}
    - from:
        - podSelector:
            matchLabels:
              app: {{ .app }}
      ports:
        - protocol: TCP
          port: {{ $.Values.service.port }}
    {{- end }}
{{- end }}
