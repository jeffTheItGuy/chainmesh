apiVersion: apps/v1
kind: Deployment
metadata:
  name: chainmesh-redis
  namespace: {{ .Values.namespace }}
  labels:
    app: chainmesh-redis
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: chainmesh-redis
  template:
    metadata:
      labels:
        app: chainmesh-redis
      annotations:
        rollme: {{ randAlphaNum 5 | quote }}
    spec:
      securityContext: {{ toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: redis
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: {{ .Values.service.port }}
              name: redis
          env:
            {{- if .Values.auth.enabled }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chainmesh-secrets
                  key: REDIS_PASSWORD
            {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              exec redis-server /usr/local/etc/redis/redis.conf {{- if .Values.auth.enabled }} --requirepass "$REDIS_PASSWORD" {{- end }} --bind 0.0.0.0
          volumeMounts:
            - name: redis-storage
              mountPath: /data
            - name: redis-config
              mountPath: /usr/local/etc/redis
            - name: tmp
              mountPath: /tmp
          resources: {{ toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  {{- if .Values.auth.enabled }}
                  REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep PONG
                  {{- else }}
                  redis-cli ping | grep PONG
                  {{- end }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  {{- if .Values.auth.enabled }}
                  REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep PONG
                  {{- else }}
                  redis-cli ping | grep PONG
                  {{- end }}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: redis-storage
          persistentVolumeClaim:
            claimName: chainmesh-redis-pvc
        - name: redis-config
          configMap:
            name: chainmesh-redis-config
        - name: tmp
          emptyDir: {}
