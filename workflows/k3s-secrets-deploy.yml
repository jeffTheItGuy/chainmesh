name: K3s Secrets Deploy
on:
  workflow_dispatch:
env:
  NAMESPACE: chainmesh
jobs:
  deploy-secrets:
    runs-on: self-hosted
    name: Deploy K3s Secrets
    steps:
      - name: Deployment Configuration
        run: |
          echo "========================================="
          echo "     K3s SECRETS DEPLOYMENT              "
          echo "========================================="
          echo "Namespace: ${{ env.NAMESPACE }}"
          echo "Secrets: chainmesh-secrets"
          echo "========================================="
      - name: Deploy Secrets to Remote K3s Cluster
        env:
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          DB_USER: ${{ secrets.DATABASE_USER }}
          DB_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if ! grep -q "$REMOTE_SERVER" ~/.ssh/known_hosts 2>/dev/null; then
            ssh-keyscan -H "$REMOTE_SERVER" >> ~/.ssh/known_hosts 2>&1
          fi
          chmod 600 ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=yes "$REMOTE_USER@$REMOTE_SERVER" \
            NAMESPACE="${{ env.NAMESPACE }}" \
            DB_USER="$DB_USER" \
            DB_PASSWORD="$DB_PASSWORD" \
            REDIS_PASSWORD="$REDIS_PASSWORD" \
            ADMIN_SECRET="$ADMIN_SECRET" \
            bash << 'ENDSSH'
          set -e
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          if ! kubectl get namespace "$NAMESPACE" >/dev/null 2>&1; then
            kubectl create namespace "$NAMESPACE"
          fi
          kubectl create secret generic chainmesh-secrets \
            --namespace "$NAMESPACE" \
            --from-literal=DATABASE_USER="$DB_USER" \
            --from-literal=DATABASE_PASSWORD="$DB_PASSWORD" \
            --from-literal=POSTGRES_DB="chainmesh" \
            --from-literal=REDIS_PASSWORD="$REDIS_PASSWORD" \
            --from-literal=ADMIN_SECRET="$ADMIN_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "✓ All secrets deployed successfully"
          ENDSSH
