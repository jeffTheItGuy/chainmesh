name: K3s Secrets Cleanup
on:
  workflow_dispatch:
env:
  NAMESPACE: chainmesh
jobs:
  cleanup-secrets:
    runs-on: ubuntu-latest
    name: Cleanup K3s Secrets
    steps:
      - name: Setup SSH
        env:
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$REMOTE_SERVER" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Remove Secrets from Remote K3s Cluster
        env:
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$REMOTE_USER@$REMOTE_SERVER" \
            NAMESPACE="${{ env.NAMESPACE }}" \
            bash << 'ENDSSH'
          set -e
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          kubectl delete secret chainmesh-secrets -n "$NAMESPACE" 2>/dev/null && echo "✓ chainmesh-secrets deleted" || echo "⚠️  chainmesh-secrets not found"
          ENDSSH
