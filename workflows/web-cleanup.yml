name: Web Cleanup
on:
  workflow_dispatch:
env:
  NAMESPACE: chainmesh
  RELEASE_NAME: web-release
  DEPLOYMENT_NAME: chainmesh-web
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        env:
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$REMOTE_SERVER" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Cleanup Helm Release and Resources
        env:
          REMOTE_SERVER: ${{ secrets.REMOTE_SERVER }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$REMOTE_USER@$REMOTE_SERVER" \
            NAMESPACE="${{ env.NAMESPACE }}" \
            RELEASE_NAME="${{ env.RELEASE_NAME }}" \
            DEPLOYMENT_NAME="${{ env.DEPLOYMENT_NAME }}" \
            bash << 'ENDSSH'
          set -e
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          helm uninstall $RELEASE_NAME -n $NAMESPACE 2>/dev/null || echo "⚠️  Release not found"
          docker rmi chainmesh-web:latest 2>/dev/null || true
          k3s ctr images rm docker.io/library/chainmesh-web:latest 2>/dev/null || true
          ENDSSH
